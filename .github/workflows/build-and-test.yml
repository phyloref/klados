name: Build and test

# This workflow lints, builds and tests Klados. It exists so that a change that
# breaks any of the three is caught on the pull request rather than at release
# time.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Keep this in step with the version used to deploy to GitHub Pages,
      # and with the `engines` field in package.json.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci` rather than `npm install`, so that the lockfile is what is
      # actually being tested.
      - name: Install dependencies
        run: npm ci

      # lint:check rather than lint, which would rewrite files with --fix.
      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
